[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2.1" ]


[project]
name = "django-test-migrations"
version = "1.6.0"
description = "Test django schema and data migrations, including ordering"
readme = "README.md"
keywords = [
  "django",
  "django-migrations",
  "django-orm",
  "django-tests",
  "migrations",
  "orm",
  "pytest",
  "pytest-plugin",
  "sql",
  "test",
  "tests"
]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10,<4.0"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Django :: 3.2",
  "Framework :: Django :: 4.1",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [ "typing-extensions>=4.16" ]

[[project.authors]]
name = "sobolevn"
email = "mail@sobolevn.me"

[project.urls]
repository = "https://github.com/wemake-services/django-test-migrations"

[project.entry-points.pytest11]
django_test_migrations = "django_test_migrations.contrib.pytest_plugin"


[tool.poetry.group.dev.dependencies]
django = ">=5.2.17,<6.2"
django-stubs = "^6.0"
mypy = "^2.3"
pytest = "^9.1"
pytest-cov = "^7.1"
pytest-django = "^4.14"
pytest-mock = "^3.15"
pytest-randomly = "^4.1"
ruff = "^0.16"
wemake-python-styleguide = "^1.7"


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
target-version = "py310"
line-length = 80
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "PYI",  # flake8-pyi
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D421",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLC0414", # it is fine to not rename an import
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF012",  # mutable class-level defaults are fine
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
external = [ "WPS" ]
flake8-quotes.inline-quotes = "single"
mccabe.max-complexity = 6
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
  "S101", # asserts
  "S404", # subprocess calls are for tests
  "S603", # do not require `shell=True`
  "S607", # partial executable paths
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"
