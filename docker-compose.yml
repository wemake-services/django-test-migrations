---
services:
  postgresql-db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=passwd123
      - POSTGRES_DB=db

  postgresql-db-17:
    image: postgres:17
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=passwd123
      - POSTGRES_DB=db

  # TODO: currently unused (no CI job references `mysql-db`) and broken as
  # pinned: `--default-authentication-plugin` was removed in MySQL 8.4+, so
  # a `mysql:8` pull that resolves past 8.4 will fail to start. Fix the
  # command/pin or drop this service before relying on it again.
  mysql-db:
    image: mysql:8
    ports:
      - "3306:3306"
    restart: unless-stopped
    environment:
      - MYSQL_USER=django
      - MYSQL_PASSWORD=passwd123
      # NOTE: MySQL container entrypoint gives user `${MYSQL_USER}` access
      # only to `${MYSQL_DATABASE}` database, so we are setting
      # `${MYSQL_DATABASE}` to Django default test database's name to avoid
      # overriding `ENTRYPOINT` or `CMD`.
      - MYSQL_DATABASE=test_db
      - MYSQL_ROOT_PASSWORD=superpasswd123
    command: --default-authentication-plugin=mysql_native_password

  maria-db:
    image: mariadb:11.4
    ports:
      - "3307:3306"
    restart: unless-stopped
    environment:
      - MARIADB_USER=django
      - MARIADB_PASSWORD=passwd123
      # NOTE: MySQL container entrypoint gives user `${MYSQL_USER}` access
      # only to `${MYSQL_DATABASE}` database, so we are setting
      # `${MYSQL_DATABASE}` to Django default test database's name to avoid
      # overriding `ENTRYPOINT` or `CMD`.
      - MARIADB_DATABASE=test_db
      - MARIADB_ROOT_PASSWORD=superpasswd123
